# Entry — Cloudflare Workers (Wrangler v3)
# Deploy target: entry.workers.dev
name = "entry"
main = "src/index.ts"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]

account_id = "e178c40dae686e916e1ae484c17682bf"
workers_dev = true

# ---- STATIC ASSETS (Wrangler v3 native) ----
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# ---- ENV: production ----
[env.production]
name = "entry"
workers_dev = true

[env.production.assets]
directory = "./public"

# ---- ENV: staging ----
[env.staging]
name = "entry-staging"
workers_dev = true

[env.staging.assets]
directory = "./public"

# ---- VARS ----
[vars]
APP_NAME = "Entry"
APP_VERSION = "1.0.0"
